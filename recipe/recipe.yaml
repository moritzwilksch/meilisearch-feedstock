schema_version: 1

context:
  name: meilisearch
  version: 1.14.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/meilisearch/meilisearch/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0909838996e0a0e3bff84d1c60d1272401732b58136267542956699cd156708b

build:
  number: 0
  skip: ppc64le

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - make
    - libgit2
    - pkg-config
    - if: osx
      then:
        - libiconv

  host:
    - if: osx
      then:
        - libiconv
    - zlib
    - bzip2
    - liblzma-devel
    - libgit2
    - pkg-config
tests:
  - script:
      - meilisearch --help
      - meilisearch --version
      - meilitool --help
      - meilitool --version

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Powerful, fast, and an easy to use search engine
  homepage: https://www.meilisearch.com/
  repository: https://github.com/meilisearch

extra:
  recipe-maintainers:
    - moritzwilksch
    - wolfv
